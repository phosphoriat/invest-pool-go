name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./tests/...
      - run: go build -o bin/invest-pool ./cmd
      - run: docker compose up --build -d --wait
      - run: python3 tests/happy_path.py
      - if: always()
        run: docker compose logs && docker compose down
